alerts:
- rule: DEPLOYMENT_FAILED
- rule: DOMAIN_FAILED
domains:
- domain: cfinancia.com
  type: PRIMARY
- domain: c-financia.com
  type: ALIAS
- domain: www.cfinancia.com
  type: ALIAS
- domain: www.c-financia.com
  type: ALIAS
features:
- buildpack-stack=ubuntu-22
ingress:
  rules:
  - component:
      name: cfinancia-landing
    match:
      path:
        prefix: /
name: cfinancia-landing-react
region: nyc
static_sites:
- build_command: pnpm build
  catchall_document: index.html
  environment_slug: node-js
  github:
    branch: main
    deploy_on_push: true
    repo: CFinancia/cfinancia-landing
  name: cfinancia-landing
  output_dir: dist
  source_dir: /
